<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFood</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <a href="/">
                <img src="images/EFood-logo.svg" alt="EFood" class="header__logo-img">
            </a>      
            <nav class="header__nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="/" class="nav__link active">Home</a></li>
                    <li class="nav__item"><a href="#service" class="nav__link">Service</a></li>
                    <li class="nav__item"><a href="#cities" class="nav__link">Top cities</a></li>
                    <li class="nav__item"><a href="#contact" class="nav__link">Contract</a></li>
                </ul>
            </nav>    
            <div class="header__actions">
                <button class="action__search">
                    <img src="images/Search.svg" alt="Search">
                </button>
                
                <button class="action__cart">
                    <img src="images/Buy.png" alt="Buy">
                    
                </button>
                <span class="cart__badge">4</span>
                <button class="header__right-button">
                    <span class="signup_span">Sign Up</span>
                </button>
            </div>
        </div>
    </header>
    <main>
        <div class="main_div1">
            <div class="main_div1_left">
               <h1 class="div__h1">
                Super Fast <span class="h1_span">Food Delivery</span> Service
                </h1>
                <p class="div_p">We provide super fast-delivery service. Let’s use our services right now and get discounts of up to 50%</p>
                <div class="main_download"> 
                    <button class="div_button">Explore Food</button>
                    <a class="div_link" href="">Download App</a>
                </div>
            </div>
            <div class="main_div1_right">
                <span class="div_span_search">
                    <img  class="search_img" src="images/Search.png" alt="">
                </span>
                <img class="div_span_clock" src="images/Time.png" alt="">
                <div class="message_left">
                    <div class="row_massage">
                        <span class="div_span_funguy">
                            <img class="funny_guy_img" src="images/funny guy.png" alt="">
                        </span>
                        <div class="column_massage">
                            <h4>Alex Smith</h4>
                            <span class="delivery_span">Food Deliveryman</span>
                        </div>
                        <span class="call_span"><img src="images/Call.png" alt=""></span>
                    </div>
                </div>
                <img class="send" src="images/Send.png" alt="">
                <img class="vector" src="images/Vector 7.png" alt="">
                
                <div class="message_right">
                    <div class="image-container">
                        <img src="images/sandwitch.png" alt="" class="sandwich_img">
                    </div>

                    <div class="sandwich-container">    
                        <p class="sandwich_text">Doubble sandwich</p>
                        <div class="stars_icons">
                            <img src="images/Icons=Star.png" alt="Иконка 1" class="icon">
                            <img src="images/Icons=Star.png" alt="Иконка 2" class="icon">
                            <img src="images/Icons=Star.png" alt="Иконка 3" class="icon">
                            <img src="images/Icons=Star.png" alt="Иконка 4" class="icon">
                            <img src="images/Icons=Star.png" alt="Иконка 5" class="icon">
                        </div>
                    
                        <!--<div class="div_dollar_price">
                            <img class="dollar_icon" src="images/$.png" alt="Иконка 6">
                            <span>7.50</span>
                        </div>-->
                        <span class="dollar">$</span>
                        <p class="price">7.50</p>
                    </div>  
                </div>

            <img class="img_scooter_guy" src="images/Scooter Guy.png" alt="">

            </div>
        </div>
    </main>
</body>
</html>
