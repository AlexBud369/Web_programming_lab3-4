<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFood</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="header">
        <div class="wrapper">
            <div class="header__navbar">
                
                <div class="header__logo">
                    <a href="/" class="header__logo-link">
                        <img src="images/EFood-logo.svg" alt="EFood Logo" class="header__logo-pic">
                    </a>
                </div>

                
                <nav class="header__right">
                    <ul class="header__right-menu">
                        <li class="header__right-list">
                            <a class="header__right-link" href="/">Home</a>
                        </li>
                        <li class="header__right-list">
                            <a class="header__right-link" href="/service">Service</a>
                        </li>
                        <li class="header__right-list">
                            <a class="header__right-link" href="/top-cities">Top Cities</a>
                        </li>
                        <li class="header__right-list">
                            <a class="header__right-link" href="/contact">Contact</a>
                        </li>
                        <li class="header__right-list">
                            <a class="header__right-link" href="/service">
                                <img src="images/Search.svg" alt="Search Icon" class="header__icon">
                            </a>
                        </li>
                        <li class="header__right-list">
                            <a class="header__right-link" href="/service">
                                <img src="images/Buy.png" alt="Order Icon" class="header__icon">
                            </a>
                        </li>
                    </ul>

                    
                    <button class="header__right-button">Sign up</button>
                </nav>
            </div>
        </div>
    </header>

</html>
